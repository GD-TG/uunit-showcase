version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: uunit_showcase_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: showcase_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d showcase_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uunit_showcase_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/showcase_db
      - SECRET_KEY=uunit-showcase-super-secret-key-production-jwt-token-2026
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./frontend/dist:/app/frontend/dist

volumes:
  postgres_data:
